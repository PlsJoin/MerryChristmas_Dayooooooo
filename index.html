<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クリスマスツリー | SAITOに送ろう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --night-top: #0a1424;
  --night-bottom: #16253f;
  --paper: #f7f2e7;
  --line: #e2d8c1;
  --ink: #2b2720;
  --ink-soft: #7d7463;
  --wine: #b23a48;
  --wine-dark: #922f3b;
  --mint: #3f9a6f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { background: var(--night-top); }
body {
  font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  background: linear-gradient(180deg, var(--night-top) 0%, var(--night-bottom) 100%) fixed;
  min-height: 100vh;
  color: #eee8da;
  padding: 36px 18px 48px;
  position: relative;
  overflow-x: hidden;
}
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.container { position: relative; z-index: 1; width: 100%; max-width: 440px; margin: 0 auto; }
.hero { text-align: center; margin-bottom: 24px; }
.tree-svg { width: 180px; height: auto; display: block; margin: 0 auto; overflow: visible; }
.title { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.06em; margin-top: 14px; }
.to {
  display: inline-block;
  margin-top: 12px;
  padding: 6px 16px;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #fff;
  background: var(--wine);
  border-radius: 999px;
}
.subtitle { font-size: 0.86rem; line-height: 1.8; color: #aeb5c2; margin-top: 12px; }
.light { animation: twinkle 3.2s ease-in-out infinite; }
.light:nth-child(2n) { animation-delay: 0.8s; }
.light:nth-child(3n) { animation-delay: 1.6s; }
.light:nth-child(5n) { animation-delay: 2.3s; }
@keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
.bauble { transform-box: fill-box; transform-origin: 50% 0%; animation: drop 0.7s cubic-bezier(.3,1.5,.5,1) both; }
.bauble.swing { animation: swing 2.8s ease-in-out infinite; }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes swing { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.paper {
  background: var(--paper);
  color: var(--ink);
  border-radius: 14px;
  padding: 26px 24px 24px;
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
}
.dest {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding-bottom: 14px;
  margin-bottom: 22px;
  border-bottom: 1px dashed #cfc3a8;
}
.dest span { font-size: 0.78rem; color: var(--ink-soft); }
.dest strong { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.06em; }
.field-label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--ink-soft); margin-bottom: 8px; }
input[type="text"], textarea {
  width: 100%;
  font-family: inherit;
  font-size: 1rem;
  color: var(--ink);
  background: transparent;
  border: none;
  border-bottom: 1px solid #cdc0a3;
  padding: 8px 2px;
  outline: none;
  transition: border-color 0.2s;
  border-radius: 0;
}
input[type="text"]::placeholder, textarea::placeholder { color: #b3a78e; }
input[type="text"]:focus, textarea:focus { border-bottom-color: var(--wine); }
.group { margin-bottom: 24px; }
textarea {
  resize: none;
  min-height: 190px;
  line-height: 2.2rem;
  padding: 0 2px;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(2.2rem - 1px), var(--line) calc(2.2rem - 1px), var(--line) 2.2rem);
  background-attachment: local;
  border-bottom: none;
}
.count { text-align: right; font-size: 0.75rem; color: var(--ink-soft); margin-top: 6px; }
.baubles { display: flex; gap: 14px; justify-content: space-between; padding: 4px 2px; }
.pick {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  position: relative;
  box-shadow: inset -4px -5px 8px rgba(0, 0, 0, 0.22), inset 4px 4px 7px rgba(255, 255, 255, 0.35), 0 2px 4px rgba(0, 0, 0, 0.25);
  transition: transform 0.18s;
}
.pick:hover { transform: translateY(-2px); }
.pick::after {
  content: '';
  position: absolute;
  inset: -6px;
  border: 2px solid transparent;
  border-radius: 50%;
  transition: border-color 0.2s;
}
.pick[aria-checked="true"]::after { border-color: var(--wine); }
.check {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  margin-bottom: 18px;
  padding: 14px 16px;
  font-family: inherit;
  text-align: left;
  color: var(--ink);
  background: #fffdf8;
  border: 1px solid #d6cab0;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  transition: border-color 0.2s, background 0.2s;
}
.check:hover { background: #fff; }
.check[data-state="loading"] { cursor: progress; }
.check[data-state="done"] { cursor: default; border-color: #a9d3bd; background: #f3faf6; }
.check-box {
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  border: 2px solid #a79b82;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1rem;
  font-weight: 700;
  background: #fff;
}
.check[data-state="loading"] .check-box {
  border: 3px solid #e4dcc9;
  border-top-color: var(--wine);
  border-radius: 50%;
  background: transparent;
  animation: spin 0.7s linear infinite;
}
.check[data-state="done"] .check-box { background: var(--mint); border-color: var(--mint); animation: pop 0.35s ease both; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { 0% { transform: scale(0.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
.check-text { font-size: 0.95rem; font-weight: 500; line-height: 1.4; flex: 1; }
.check-text small { display: block; font-size: 0.72rem; font-weight: 400; color: var(--ink-soft); }
.check-brand { font-size: 0.62rem; color: #a79b82; text-align: right; line-height: 1.3; letter-spacing: 0.04em; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.send {
  width: 100%;
  padding: 15px;
  font-family: inherit;
  font-size: 1.02rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: #fff;
  background: var(--wine);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s, opacity 0.2s, transform 0.15s;
}
.send:hover:not(:disabled) { background: var(--wine-dark); transform: translateY(-1px); }
.send:disabled { opacity: 0.4; cursor: not-allowed; }
.error { color: var(--wine); font-size: 0.82rem; text-align: center; margin-top: 12px; min-height: 1.2em; }
.thanks { display: none; text-align: center; padding: 26px 0 18px; }
.thanks.show { display: block; animation: fade 0.6s ease both; }
.thanks h2 { font-weight: 700; font-size: 1.2rem; letter-spacing: 0.06em; margin-bottom: 12px; }
.thanks p { font-size: 0.92rem; line-height: 2; color: var(--ink-soft); }
.again {
  margin-top: 20px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  background: none;
  border: 1px solid #cfc3a8;
  border-radius: 999px;
  color: var(--ink);
  cursor: pointer;
  padding: 8px 18px;
}
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.footer { text-align: center; margin-top: 28px; font-size: 0.78rem; letter-spacing: 0.06em; color: #8b93a3; }
@media (prefers-reduced-motion: reduce) {
  .light, .bauble, .bauble.swing, .check-box { animation: none !important; }
}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div class="container">
  <div class="hero">
    <svg class="tree-svg" viewBox="0 0 200 250" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#23674a"/>
          <stop offset="1" stop-color="#17432f"/>
        </linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1d563e"/>
          <stop offset="1" stop-color="#113526"/>
        </linearGradient>
        <radialGradient id="shine" cx="0.35" cy="0.3" r="0.7">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
          <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x="92" y="205" width="16" height="26" fill="#3a2a1f"/>
      <polygon points="100,88 28,208 172,208" fill="url(#g2)"/>
      <polygon points="100,52 44,150 156,150" fill="url(#g1)"/>
      <polygon points="100,28 62,96 138,96" fill="url(#g2)"/>
      <path d="M100 12 L103.2 21.4 L113 21.6 L105.2 27.4 L108 37 L100 31.4 L92 37 L94.8 27.4 L87 21.6 L96.8 21.4 Z" fill="#f1d27c"/>
      <g fill="#f6e2a6">
        <circle class="light" cx="92" cy="62" r="1.8"/>
        <circle class="light" cx="108" cy="78" r="1.8"/>
        <circle class="light" cx="80" cy="104" r="1.8"/>
        <circle class="light" cx="120" cy="116" r="1.8"/>
        <circle class="light" cx="66" cy="136" r="1.8"/>
        <circle class="light" cx="134" cy="140" r="1.8"/>
        <circle class="light" cx="98" cy="132" r="1.8"/>
        <circle class="light" cx="52" cy="176" r="1.8"/>
        <circle class="light" cx="148" cy="180" r="1.8"/>
        <circle class="light" cx="86" cy="170" r="1.8"/>
        <circle class="light" cx="116" cy="164" r="1.8"/>
        <circle class="light" cx="72" cy="196" r="1.8"/>
        <circle class="light" cx="130" cy="198" r="1.8"/>
      </g>
      <g id="hangers"></g>
    </svg>
    <h1 class="title">クリスマスツリー</h1>
    <div class="to">SAITOに送ろう</div>
    <p class="subtitle">メッセージを書いて、ツリーに飾ってね</p>
  </div>

  <div class="paper">
    <form id="letterForm" action="https://formspree.io/f/ここにあなたのフォームID" method="POST" novalidate>
      <div class="dest"><span>宛先</span><strong>SAITO</strong></div>
      <input type="hidden" name="to" value="SAITO">

      <div class="group">
        <label class="field-label" for="name">お名前</label>
        <input type="text" name="name" id="name" placeholder="匿名でも大丈夫です" maxlength="30" autocomplete="off">
      </div>

      <div class="group">
        <span class="field-label" id="orn-label">飾りの色</span>
        <div class="baubles" id="baubles" role="radiogroup" aria-labelledby="orn-label"></div>
        <input type="hidden" name="ornament" id="ornamentInput" value="">
      </div>

      <div class="group">
        <label class="field-label" for="message">メッセージ</label>
        <textarea name="message" id="message" placeholder="SAITOへのメッセージを自由に書いてね。&#10;短くても長くてもOK。" maxlength="1000" required></textarea>
        <div class="count"><span id="count">0</span> / 1000</div>
      </div>

      <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button type="button" class="check" id="check" role="checkbox" aria-checked="false" data-state="idle">
        <span class="check-box" id="checkBox"></span>
        <span class="check-text" id="checkText">私はロボットではありません<small>タップして確認</small></span>
        <span class="check-brand">セキュリティ<br>チェック</span>
      </button>

      <button type="submit" class="send" id="submitBtn" disabled>SAITOに送る</button>
      <p class="error" id="error" role="alert"></p>
    </form>

    <div class="thanks" id="thanks">
      <h2>SAITOに届きました</h2>
      <p>メッセージがツリーに飾られたよ。<br>ありがとう!</p>
      <button type="button" class="again" id="again">もう一通書く</button>
    </div>
  </div>

  <p class="footer">@OP Portal_plsjoin.domain</p>
</div>

<script>
const COLORS = [
  { name: '赤', base: '#c0303c' },
  { name: '金', base: '#d9ad45' },
  { name: '銀', base: '#b4bcc9' },
  { name: '青', base: '#3568b3' },
  { name: '桃', base: '#df8fa6' },
  { name: '緑', base: '#35946b' }
];
const SLOTS = [[84, 98], [116, 108], [70, 148], [128, 156], [96, 150], [58, 194], [104, 190], [142, 196]];
const STORAGE_KEY = 'xmas-letter-draft-v2';
const NS = 'http://www.w3.org/2000/svg';

const form = document.getElementById('letterForm');
const nameEl = document.getElementById('name');
const msgEl = document.getElementById('message');
const countEl = document.getElementById('count');
const submitBtn = document.getElementById('submitBtn');
const errorEl = document.getElementById('error');
const thanksEl = document.getElementById('thanks');
const againBtn = document.getElementById('again');
const baublesBox = document.getElementById('baubles');
const ornInput = document.getElementById('ornamentInput');
const hangers = document.getElementById('hangers');
const checkEl = document.getElementById('check');
const checkBoxEl = document.getElementById('checkBox');
const checkTextEl = document.getElementById('checkText');

let colorIndex = 0;
let slotIndex = 0;
let current = null;
let verified = false;

function mk(tag, attrs) {
  const el = document.createElementNS(NS, tag);
  Object.keys(attrs).forEach(k => el.setAttribute(k, attrs[k]));
  return el;
}

function buildBauble(x, y, color) {
  const g = mk('g', { class: 'bauble swing' });
  g.appendChild(mk('line', { x1: x, y1: y - 12, x2: x, y2: y - 6, stroke: '#d8c28a', 'stroke-width': 0.8 }));
  g.appendChild(mk('rect', { x: x - 2.2, y: y - 7.4, width: 4.4, height: 2.6, rx: 0.8, fill: '#d8c28a' }));
  const body = mk('circle', { cx: x, cy: y, r: 7, fill: color });
  g.appendChild(body);
  g.appendChild(mk('circle', { cx: x, cy: y, r: 7, fill: 'url(#shine)' }));
  g.body = body;
  return g;
}

function placeCurrent() {
  if (current) current.remove();
  const s = SLOTS[slotIndex % SLOTS.length];
  current = buildBauble(s[0], s[1], COLORS[colorIndex].base);
  hangers.appendChild(current);
}

function setColor(i) {
  colorIndex = i;
  ornInput.value = COLORS[i].name;
  Array.from(baublesBox.children).forEach((b, k) => b.setAttribute('aria-checked', k === i ? 'true' : 'false'));
  if (current && current.body) {
    current.body.setAttribute('fill', COLORS[i].base);
  } else {
    placeCurrent();
  }
  saveDraft();
}

COLORS.forEach((c, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'pick';
  b.style.background = c.base;
  b.setAttribute('role', 'radio');
  b.setAttribute('aria-label', c.name);
  b.setAttribute('aria-checked', 'false');
  b.addEventListener('click', () => setColor(i));
  baublesBox.appendChild(b);
});

function saveDraft() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      name: nameEl.value,
      message: msgEl.value,
      color: colorIndex,
      slot: slotIndex
    }));
  } catch (e) {}
}

function loadDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function clearDraft() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

function refresh() {
  countEl.textContent = msgEl.value.length;
  submitBtn.disabled = !(msgEl.value.trim().length > 0 && verified);
}

function setCheckState(state) {
  checkEl.setAttribute('data-state', state);
  verified = state === 'done';
  checkEl.setAttribute('aria-checked', verified ? 'true' : 'false');
  if (state === 'idle') {
    checkBoxEl.textContent = '';
    checkTextEl.innerHTML = '私はロボットではありません<small>タップして確認</small>';
  } else if (state === 'loading') {
    checkBoxEl.textContent = '';
    checkTextEl.innerHTML = '確認しています…<small>少しだけお待ちください</small>';
  } else {
    checkBoxEl.textContent = '✓';
    checkTextEl.innerHTML = '確認できました<small>ありがとうございます</small>';
  }
  refresh();
}

checkEl.addEventListener('click', () => {
  if (checkEl.getAttribute('data-state') !== 'idle') return;
  setCheckState('loading');
  setTimeout(() => setCheckState('done'), 1200 + Math.random() * 600);
});

msgEl.addEventListener('input', () => { refresh(); saveDraft(); });
nameEl.addEventListener('input', saveDraft);

const draft = loadDraft();
if (draft) {
  nameEl.value = draft.name || '';
  msgEl.value = draft.message || '';
  slotIndex = typeof draft.slot === 'number' ? draft.slot : 0;
  setColor(typeof draft.color === 'number' && COLORS[draft.color] ? draft.color : 0);
} else {
  slotIndex = Math.floor(Math.random() * SLOTS.length);
  setColor(0);
}
refresh();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (msgEl.value.trim().length === 0 || !verified) return;
  errorEl.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = '送っています…';
  try {
    const res = await fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { Accept: 'application/json' }
    });
    if (!res.ok) throw new Error('bad status');
    clearDraft();
    form.style.display = 'none';
    thanksEl.classList.add('show');
    current = null;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    errorEl.textContent = '送信できませんでした。通信状況を確認して、もう一度お試しください。';
    submitBtn.disabled = false;
    submitBtn.textContent = 'SAITOに送る';
  }
});

againBtn.addEventListener('click', () => {
  msgEl.value = '';
  nameEl.value = '';
  slotIndex = (slotIndex + 1) % SLOTS.length;
  current = null;
  thanksEl.classList.remove('show');
  form.style.display = '';
  submitBtn.textContent = 'SAITOに送る';
  setColor(colorIndex);
  setCheckState('idle');
});

const canvas = document.getElementById('snow');
const ctx = canvas.getContext('2d');
let flakes = [];
let W = 0;
let H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initFlakes() {
  const n = Math.min(70, Math.floor(W / 14));
  flakes = [];
  for (let i = 0; i < n; i++) {
    flakes.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.6 + 0.5,
      v: Math.random() * 0.45 + 0.2,
      p: Math.random() * Math.PI * 2
    });
  }
}

function tick() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff';
  flakes.forEach(f => {
    f.y += f.v;
    f.p += 0.01;
    f.x += Math.sin(f.p) * 0.25;
    if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
    ctx.globalAlpha = 0.25 + f.r / 3;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
  });
  requestAnimationFrame(tick);
}

resize();
initFlakes();
window.addEventListener('resize', () => { resize(); initFlakes(); });
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
