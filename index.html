<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クリスマスツリーにお手紙</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background: linear-gradient(165deg, #0b1726 0%, #152a45 45%, #1e3a5f 100%);
      min-height: 100vh;
      color: #f3efe6;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .tree-area {
      text-align: center;
      margin-bottom: 32px;
    }

    .tree {
      font-size: 108px;
      line-height: 1;
      filter: drop-shadow(0 0 24px rgba(46, 204, 113, 0.4));
    }

    .title {
      font-size: 1.7rem;
      font-weight: 700;
      margin-top: 10px;
      letter-spacing: 0.05em;
    }

    .subtitle {
      font-size: 0.92rem;
      opacity: 0.72;
      margin-top: 8px;
      line-height: 1.5;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 22px;
      padding: 32px 26px 28px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    label {
      display: block;
      font-size: 0.88rem;
      margin-bottom: 8px;
      opacity: 0.9;
      letter-spacing: 0.03em;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.28);
      color: #f3efe6;
      font-family: inherit;
      font-size: 0.98rem;
      margin-bottom: 22px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #7dcea0;
      background: rgba(0, 0, 0, 0.38);
    }

    textarea {
      resize: vertical;
      min-height: 180px;
      line-height: 1.65;
    }

    .ornaments {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .ornament {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 2px solid transparent;
      background: rgba(0, 0, 0, 0.28);
      font-size: 1.55rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s;
    }

    .ornament:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .ornament.selected {
      border-color: #f1c40f;
      background: rgba(241, 196, 15, 0.18);
      transform: scale(1.07);
      box-shadow: 0 0 12px rgba(241, 196, 15, 0.25);
    }

    .char-count {
      text-align: right;
      font-size: 0.78rem;
      opacity: 0.55;
      margin-top: -16px;
      margin-bottom: 22px;
    }

    .security-box {
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .security-box:hover {
      background: rgba(0, 0, 0, 0.3);
    }

    .security-box.checked {
      border-color: rgba(46, 204, 113, 0.45);
      background: rgba(46, 204, 113, 0.08);
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .security-box.checked .checkbox {
      background: #27ae60;
      border-color: #27ae60;
    }

    .security-text {
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .security-text span {
      display: block;
      font-size: 0.75rem;
      opacity: 0.55;
      margin-top: 2px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #219a52, #2ecc71);
      color: white;
      font-family: inherit;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
      box-shadow: 0 6px 20px rgba(46, 204, 113, 0.25);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(46, 204, 113, 0.35);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.8rem;
      opacity: 0.48;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="tree-area">
      <div class="tree">🎄</div>
      <h1 class="title">クリスマスツリー</h1>
      <p class="subtitle">あなたの気持ちを<br>オーナメントに込めて飾ってください</p>
    </div>

    <div class="card">
      <form id="letterForm" action="https://formspree.io/f/ここにあなたのフォームID" method="POST">
        <label>お名前</label>
        <input type="text" name="name" id="name" placeholder="匿名でも大丈夫です" maxlength="30">

        <label>オーナメントを選ぶ</label>
        <div class="ornaments" id="ornamentList">
          <div class="ornament selected" data-emoji="🎁">🎁</div>
          <div class="ornament" data-emoji="⭐">⭐</div>
          <div class="ornament" data-emoji="🔔">🔔</div>
          <div class="ornament" data-emoji="❄️">❄️</div>
          <div class="ornament" data-emoji="🎅">🎅</div>
          <div class="ornament" data-emoji="🦌">🦌</div>
          <div class="ornament" data-emoji="🧦">🧦</div>
          <div class="ornament" data-emoji="🍪">🍪</div>
          <div class="ornament" data-emoji="🕯️">🕯️</div>
          <div class="ornament" data-emoji="💌">💌</div>
        </div>
        <input type="hidden" name="ornament" id="ornamentInput" value="🎁">

        <label>メッセージ</label>
        <textarea name="message" id="message" placeholder="伝えたいことを自由に書いてください。&#10;短くても、長くても大丈夫です。" maxlength="1000" required></textarea>
        <div class="char-count"><span id="count">0</span> / 1000</div>

        <div class="security-box" id="securityBox">
          <div class="checkbox" id="checkbox"></div>
          <div class="security-text">
            私はロボットではありません
            <span>送信前の簡単な確認です</span>
          </div>
        </div>

        <button type="submit" id="submitBtn" disabled>ツリーに飾る</button>
      </form>
    </div>

    <p class="footer">大切な気持ちを、そっと届けます</p>
  </div>

  <script>
    let selectedOrnament = "🎁";
    let isVerified = false;

    document.querySelectorAll(".ornament").forEach(el => {
      el.addEventListener("click", () => {
        document.querySelectorAll(".ornament").forEach(o => o.classList.remove("selected"));
        el.classList.add("selected");
        selectedOrnament = el.dataset.emoji;
        document.getElementById("ornamentInput").value = selectedOrnament;
      });
    });

    const textarea = document.getElementById("message");
    const count = document.getElementById("count");
    const securityBox = document.getElementById("securityBox");
    const checkbox = document.getElementById("checkbox");
    const submitBtn = document.getElementById("submitBtn");

    textarea.addEventListener("input", () => {
      count.textContent = textarea.value.length;
    });

    securityBox.addEventListener("click", () => {
      isVerified = !isVerified;
      securityBox.classList.toggle("checked", isVerified);
      checkbox.textContent = isVerified ? "✓" : "";
      submitBtn.disabled = !isVerified;
    });

    document.getElementById("letterForm").addEventListener("submit", function(e) {
      if (!isVerified) {
        e.preventDefault();
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = "飾っています…";
    });
  </script>
</body>
</html>
